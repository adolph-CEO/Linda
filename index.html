<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>靈魂藍圖 SPA｜線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Manrope:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --plum-deep:#6B4E71;
  --plum:#6B4E71;
  --berry:#8A4F73;
  --rose:#D9A9B0;
  --blush:#F1E9F0;
  --parchment:#FBF6F4;
  --gold:#C9713F;
  --gold-soft:#e8c3a6;
  --ink:#332733;
  --ink-soft:#5A4C57;
  --ink-muted:#9C8B95;
  --line:#EDE1E5;
  --ok:#5c8a6a;
  --danger:#b3543f;
  --disabled:#DCCFDA;
  --shadow:0 10px 30px rgba(51,39,51,.12);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Manrope','Noto Sans TC',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Playfair Display','Noto Serif TC',serif;font-weight:700;margin:0;}
.accent-en{font-family:'Playfair Display','Noto Serif TC',serif;font-weight:700;font-style:normal;}
.page-kicker{font-family:'Manrope','Noto Sans TC',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--berry);margin-bottom:4px;}
.page-title{font-family:'Playfair Display','Noto Serif TC',serif;font-weight:700;font-size:21px;color:var(--ink);}
button{font-family:inherit;}
a{color:inherit;}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--parchment);position:relative;box-shadow:0 0 60px rgba(0,0,0,.08);}
.hidden{display:none !important;}
.hero{position:relative;padding:38px 24px 30px;background:linear-gradient(120deg,#D9A9B0 0%,#6B4E71 100%);color:#fff;overflow:hidden;text-align:center;}
.brand-strip{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(120deg,#D9A9B0 0%,#6B4E71 100%);color:#fff;}
.brand-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.brand-text{line-height:1.3;}
.brand-name{font-family:'Playfair Display','Noto Serif TC',serif;font-weight:700;font-size:15px;}
.brand-tagline{font-size:10px;opacity:.85;margin-top:2px;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.35), transparent 55%);pointer-events:none;}
.hero .stars{position:absolute;inset:0;pointer-events:none;}
.hero .stars span{position:absolute;color:rgba(255,255,255,.55);font-size:11px;}
.hero-logo{width:118px;height:auto;position:relative;z-index:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));margin-bottom:6px;}
.hero h1{font-size:26px;letter-spacing:.14em;font-weight:600;position:relative;z-index:1;}
.hero .sub{margin-top:6px;font-size:12.5px;letter-spacing:.32em;opacity:.85;position:relative;z-index:1;}
.hero .tagline{margin-top:16px;font-size:13.5px;line-height:1.9;opacity:.92;position:relative;z-index:1;font-weight:300;}
.hero .divider{width:34px;height:1px;background:rgba(255,255,255,.55);margin:16px auto 0;position:relative;z-index:1;}
.steps{display:flex;justify-content:center;gap:6px;padding:16px 20px 4px;background:var(--parchment);}
.step-dot{flex:1;max-width:52px;height:3px;border-radius:2px;background:var(--line);transition:.3s;}
.step-dot.active{background:linear-gradient(90deg,var(--rose),var(--gold));}
.step-dot.done{background:var(--gold-soft);}
.section{padding:22px 20px 6px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.section-title{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.section-title .num{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:22px;}
.section-title h2{font-size:17px;letter-spacing:.04em;color:var(--plum-deep);}
.section-title .opt{font-size:11px;color:var(--ink-soft);margin-left:auto;}
.service-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:4px 40px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.service-carousel::-webkit-scrollbar{display:none;}
.car-card{flex:0 0 auto;height:230px;border-radius:22px;position:relative;background-size:cover;background-position:center;scroll-snap-align:center;cursor:pointer;overflow:hidden;transition:width .35s ease,border-color .2s;background-color:#e9dde3;}
.car-card.selected{width:210px;border:2px solid var(--plum);box-shadow:0 10px 26px rgba(107,78,113,.28);}
.car-card:not(.selected){width:58px;border:2px solid transparent;}
.car-card:not(.selected)::before{content:"";position:absolute;inset:0;background:rgba(35,24,34,.5);}
.car-card:not(.selected) .car-name-vertical{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;color:#fff;font-size:12px;letter-spacing:.08em;font-family:'Noto Sans TC',sans-serif;opacity:.95;}
.car-card.selected .car-name-vertical{display:none;}
.car-card.selected::after{content:"";position:absolute;left:0;right:0;bottom:0;height:65%;background:linear-gradient(to top, rgba(35,24,34,.82), transparent);}
.car-card .car-info{display:none;}
.car-card.selected .car-info{display:block;position:absolute;left:14px;right:14px;bottom:12px;z-index:2;color:#fff;}
.car-card .car-info .cn-name{font-family:'Playfair Display','Noto Serif TC',serif;font-weight:700;font-size:17px;}
.car-card .car-info .cn-meta{font-size:11px;opacity:.85;margin-top:2px;}
.car-card .car-info .cn-price{font-family:'Playfair Display','Noto Serif TC',serif;font-weight:700;font-size:16px;margin-top:6px;}
.car-check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--plum);color:#fff;display:none;align-items:center;justify-content:center;font-size:14px;z-index:2;}
.car-card.selected .car-check{display:flex;}
.carousel-label{font-size:12px;color:var(--ink-muted);margin-bottom:8px;}
.addon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.addon-card{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;background:#fff;}
.addon-card.checked{background:var(--blush);border-color:var(--plum);}
.addon-card .ac-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.addon-card .ac-name{font-size:13px;color:var(--ink);line-height:1.5;}
.addon-card .ac-price{font-size:11.5px;color:var(--gold);margin-top:6px;font-weight:600;}
.ac-checkbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
.addon-card.checked .ac-checkbox{background:var(--plum);border-color:var(--plum);}
.addon-card.checked .ac-checkbox::after{content:"✓";color:#fff;font-size:11px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--plum);}
.cal-nav:disabled{opacity:.3;cursor:default;}
.cal-month{font-family:'Noto Serif TC',serif;font-size:15px;color:var(--plum-deep);letter-spacing:.05em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
.cal-dow{font-size:10.5px;color:var(--ink-soft);padding-bottom:4px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;}
.cal-day{width:100%;height:100%;border-radius:50%;border:none;background:transparent;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.cal-day.past{color:#d7cdd2;cursor:default;}
.cal-day.full{color:#d7cdd2;cursor:default;text-decoration:line-through;text-decoration-color:#d7cdd2;}
.cal-day.available:hover{background:var(--blush);}
.cal-day.selected{background:linear-gradient(135deg,var(--rose),var(--plum));color:#fff;font-weight:600;}
.cal-day.today::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--gold);}
.cal-legend{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--ink-soft);flex-wrap:wrap;}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.slot{border:1.5px solid var(--gold-soft);border-radius:12px;padding:12px 6px;text-align:center;font-size:14px;color:var(--plum-deep);cursor:pointer;background:#fffdf9;transition:.15s;font-weight:500;}
.slot:active{transform:scale(.97);}
.slot.taken{border-color:var(--line);color:#c7bcc2;background:#f2eeef;cursor:default;text-decoration:line-through;}
.slot.selected{background:linear-gradient(135deg,var(--rose),var(--plum));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(154,58,114,.35);}
.slot-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);font-size:12.5px;padding:14px 0;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text],.field input[type=tel],.field input[type=password],.field textarea{width:100%;padding:12px 14px;border:none;border-radius:14px;font-size:14px;background:#F7F1F5;color:var(--ink);font-family:inherit;}
.field textarea{resize:vertical;min-height:64px;font-family:inherit;}
.field input:focus,.field textarea:focus{outline:2px solid var(--gold-soft);outline-offset:1px;border-color:var(--gold);}
.pill-group{display:flex;flex-wrap:wrap;gap:8px;}
.pill{padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;background:#fff;color:var(--ink-soft);transition:.15s;}
.pill.on{background:var(--plum);border-color:var(--plum);color:#fff;}
.toggle-row{display:flex;gap:10px;}
.toggle-row .pill{flex:1;text-align:center;}
.btn{width:100%;padding:15px;border-radius:999px;border:none;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:.15s;font-family:'Manrope','Noto Sans TC',sans-serif;}
.btn-primary{background:linear-gradient(120deg,var(--rose),var(--plum));color:#fff;box-shadow:0 8px 20px rgba(107,78,113,.3);}
.btn-primary:disabled{background:var(--disabled);opacity:1;box-shadow:none;cursor:default;color:#fff;}
.btn-primary:active:not(:disabled){transform:translateY(1px);}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
.btn-row{display:flex;gap:10px;margin-top:18px;}
.btn-row .btn-ghost{flex:0 0 92px;}
.cta-subtext{text-align:center;font-size:11.5px;color:var(--ink-muted);margin-top:10px;}
.summary{background:var(--blush);border-radius:14px;padding:16px;font-size:13px;color:var(--plum-deep);line-height:2;}
.summary b{color:var(--berry);}
.confirm-wrap{padding:50px 26px;text-align:center;}
.confirm-icon{font-size:44px;}
.confirm-wrap h2{font-size:19px;margin:16px 0 8px;color:var(--plum-deep);}
.confirm-wrap p{font-size:13px;color:var(--ink-soft);line-height:1.9;}
.notice-card{margin:26px 0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;font-size:12.5px;color:var(--ink-soft);line-height:2.1;}
.notice-card h3{font-size:13px;color:var(--plum-deep);margin-bottom:8px;}
.contact-card{margin-top:22px;background:linear-gradient(150deg,var(--plum-deep),var(--plum));color:#fff;border-radius:16px;padding:20px;text-align:center;}
.contact-card .name-en{font-size:20px;}
.contact-card .name-zh{font-size:13px;letter-spacing:.2em;opacity:.85;margin-top:2px;}
.contact-card img{width:120px;height:120px;border-radius:10px;margin-top:14px;background:#fff;padding:6px;}
.contact-card .phone{margin-top:10px;font-size:13px;opacity:.9;}
.foot{padding:26px 20px 40px;text-align:center;}
.foot a{font-size:11px;color:var(--ink-soft);text-decoration:none;border-bottom:1px dotted var(--ink-soft);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--plum-deep);color:#fff;padding:11px 20px;border-radius:30px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:999;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;bottom:34px;}
.admin-lock{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--plum-deep);padding:24px;}
.lock-card{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:320px;text-align:center;}
.lock-card h2{font-size:16px;color:var(--plum-deep);margin-bottom:16px;}
.lock-card input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:16px;margin-bottom:14px;}
.lock-err{color:var(--danger);font-size:12px;margin-bottom:10px;min-height:14px;}
.admin{background:var(--parchment);min-height:100vh;}
.admin-top{background:var(--plum-deep);color:#fff;padding:18px 18px 14px;display:flex;align-items:center;justify-content:space-between;}
.admin-top h1{font-size:16px;letter-spacing:.06em;}
.admin-top a{font-size:11.5px;opacity:.75;text-decoration:none;}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
.tab{flex:0 0 auto;padding:13px 16px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tab.active{color:var(--berry);border-color:var(--berry);font-weight:600;}
.admin-body{padding:18px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
.stat .label{font-size:11px;color:var(--ink-soft);}
.stat .value{font-family:'Noto Serif TC',serif;font-size:22px;color:var(--plum-deep);margin-top:4px;}
.stat .value small{font-size:12px;font-weight:400;color:var(--ink-soft);}
.list-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.li-top{display:flex;justify-content:space-between;align-items:center;}
.li-name{font-weight:600;font-size:14px;color:var(--plum-deep);}
.li-time{font-size:12px;color:var(--berry);font-weight:600;}
.li-meta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.7;}
.tag-sm{display:inline-block;background:var(--blush);color:var(--berry);font-size:10.5px;padding:2px 8px;border-radius:10px;margin-right:4px;margin-top:4px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px;}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;color:var(--plum);cursor:pointer;}
.mini-btn.primary{background:var(--plum);color:#fff;border-color:var(--plum);}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;}
.search-bar{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;font-size:13.5px;background:#fff;}
.modal-bg{position:fixed;inset:0;background:rgba(47,27,61,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 30px;width:100%;max-width:520px;max-height:82vh;overflow:auto;}
.modal h3{font-size:15px;color:var(--plum-deep);margin-bottom:14px;}
.modal-close{float:right;color:var(--ink-soft);cursor:pointer;font-size:13px;}
.cal-sub{font-size:11px;color:var(--ink-soft);word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;}
.admin-cal-day{width:100%;height:100%;border-radius:12px;border:1px solid var(--line);background:#fdfbfa;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:.15s;padding:4px 0;}
.admin-cal-day .acd-num{font-size:12.5px;color:var(--ink);}
.admin-cal-day .acd-badge{font-size:10px;font-weight:700;color:#fff;background:var(--rose);border-radius:8px;padding:1px 6px;line-height:1.4;}
.admin-cal-day.today{border-color:var(--gold);}
.admin-cal-day.selected{border-color:var(--plum);box-shadow:0 0 0 2px var(--plum) inset;}
.admin-cal-day.lv1 .acd-badge{background:#e6bcd0;color:var(--plum-deep);}
.admin-cal-day.lv2 .acd-badge{background:var(--rose);}
.admin-cal-day.lv3{background:#fbeef3;}
.admin-cal-day.lv3 .acd-badge{background:var(--plum);}
.addons-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:860px){ .addons-grid{grid-template-columns:repeat(3,1fr);} }
.addon-price-lg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--berry);font-weight:600;}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* =========================================================
   靈魂藍圖 SPA - 線上預約系統（Vercel + GitHub 版）
   資料透過 /api/* 讀寫，實際存在 GitHub repo 的 data/ 目錄下
   ========================================================= */
let SERVICES = []; // 改由 /api/services 動態載入，不再寫死
let ADDONS = []; // 改由 /api/addons 動態載入，不再寫死
let ADMIN_ADDONS_ALL = null; // 後台登入後載入，含已停用項目，讓歷史訂單的加購名稱能正確顯示
let ADMIN_SERVICES_ALL = null; // 後台登入後載入，含已停用項目，讓歷史訂單的服務名稱能正確顯示
const CONCERNS = ['情緒壓力','睡眠','疲勞','腸胃','肩頸','婦科','能量提升','桃花','財運','其他'];
const TIME_SLOTS = ['10:00','11:30','13:00','14:30','16:00','17:30','19:00'];
const NOTICES = ['採預約制','遲到15分鐘將縮短療程','當日取消恕不退訂金','女性優先','如身體特殊狀況請提前告知'];
const SHOP = {name_en:'Linda', name_zh:'琳達　祭司', phone:'0970881369', line_id:'@fyy2227r'};

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function money(n){ return 'NT$'+n.toLocaleString(); }
function serviceById(id){ const pool = ADMIN_SERVICES_ALL || SERVICES; return pool.find(s=>s.id===id) || {id, name:id, duration:60, price:0, desc:''}; }
function addonById(id){ const pool = ADMIN_ADDONS_ALL || ADDONS; return pool.find(a=>a.id===id) || {id, name:id, price:0}; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }

let toastTimer=null;
function toast(msg){
  let el = document.getElementById('toastEl');
  if(!el){ el=document.createElement('div'); el.id='toastEl'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ---------- API helpers ---------- */
async function apiGet(path, admin){
  const headers = {};
  if(admin) headers['x-admin-token'] = adminToken;
  const r = await fetch(path, {headers});
  if(!r.ok) throw {status:r.status, body: await r.json().catch(()=>({}))};
  return r.json();
}
async function apiPost(path, data, admin){
  const headers = {'Content-Type':'application/json'};
  if(admin) headers['x-admin-token'] = adminToken;
  const r = await fetch(path, {method:'POST', headers, body: JSON.stringify(data)});
  const body = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(body.error||'請求失敗'); e.status=r.status; e.body=body; throw e; }
  return body;
}

/* ---------- ICS 匯出（給客戶個人下載加入手機日曆） ---------- */
function downloadICS(b){
  const svc = serviceById(b.serviceId);
  const [hh,mm] = b.time.split(':').map(Number);
  const start = parseDate(b.date); start.setHours(hh,mm,0,0);
  const end = new Date(start.getTime() + svc.duration*60000);
  const fmt = d => d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SoulBlueprintSpa//Booking//ZH-TW','BEGIN:VEVENT',
    'UID:'+b.id+'@soulblueprintspa','DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(start),'DTEND:'+fmt(end),

function monthKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }

async function ensureMonthLoaded(mKey, force){
  if(!force && monthAvailability[mKey]) return monthAvailability[mKey];
  try{
    monthAvailability[mKey] = await apiGet('/api/bookings?month='+mKey, false);
  }catch(e){
    monthAvailability[mKey] = [];
  }
  return monthAvailability[mKey];
}
function slotsFor(dateStr){
  const mKey = dateStr.slice(0,7);
  const list = monthAvailability[mKey] || [];
  const taken = new Set(list.filter(b=>b.date===dateStr).map(b=>b.time));
  return TIME_SLOTS.map(t=>({time:t, taken: taken.has(t)}));
}
function isDateFull(dateStr){ return slotsFor(dateStr).every(s=>s.taken); }

function stepDate(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayStr();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = fmtDate(new Date(y,m,d));
    const isPast = dateStr < today;
    const full = !isPast && isDateFull(dateStr);
    const isToday = dateStr === today;
    const isSel = sel.date === dateStr;
    let cls = 'cal-day';
    if(isPast) cls += ' past'; else if(full) cls += ' full'; else cls += ' available';
    if(isToday) cls += ' today';
    if(isSel) cls += ' selected';
    cells += `<div class="cal-cell"><button class="${cls}" ${(isPast||full)?'disabled':''} onclick="pickDate('${dateStr}')">${d}</button></div>`;
  }
  const dow = ['日','一','二','三','四','五','六'];
  return `
  <div class="section"><div class="card">
    <div class="page-kicker">02 · 日期時間選擇</div><h2 class="page-title" style="margin-bottom:14px;">選擇日期</h2>
    <div class="cal-head"><button class="cal-nav" onclick="shiftMonth(-1)">‹</button><div class="cal-month">${y} 年 ${m+1} 月</div><button class="cal-nav" onclick="shiftMonth(1)">›</button></div>
    <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">
      <span><span class="legend-dot" style="background:linear-gradient(135deg,#d4548a,#4a2a5e);"></span>已選擇</span>
      <span><span class="legend-dot" style="background:#faf6f3;border:1px solid #e4d8de;"></span>可預約</span>
      <span><span class="legend-dot" style="background:#d7cdd2;"></span>已額滿／過去</span>
    </div>
  </div>
  <div class="section" style="padding-top:18px;"><div class="btn-row">
    <button class="btn btn-ghost" onclick="goStep(1)">上一步</button>
    <button class="btn btn-primary" ${!sel.date?'disabled':''} onclick="goStep(3)">下一步：選擇時段</button>
  </div></div></div>`;
}
async function shiftMonth(dir){
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+dir, 1);
  const now = new Date(); now.setDate(1); now.setHours(0,0,0,0);
  if(calMonth < now) calMonth = now;
  await ensureMonthLoaded(monthKey(calMonth), true);
  document.getElementById('stepBody').innerHTML = stepDate();
}

function readFormFields(){
  sel.name = document.getElementById('f_name').value.trim();
  sel.phone = document.getElementById('f_phone').value.trim();

async function reviewAndSubmit(){
  readFormFields();
  if(!sel.name || !sel.phone){ toast('請填寫姓名與電話'); return; }
  const btn = document.getElementById('submitBtn');
  if(btn){ btn.disabled = true; btn.textContent = '送出中...'; }
  const svc = serviceById(sel.serviceId);
  const addonTotal = sel.addons.reduce((sum,id)=>sum + addonById(id).price, 0);
  const payload = {
    serviceId: sel.serviceId, addons: [...sel.addons], date: sel.date, time: sel.time,
    price: svc.price + addonTotal,
    customer: {name:sel.name, phone:sel.phone, line:sel.line, birthday:sel.birthday, firstTime: sel.firstTime},
    concerns: [...sel.concerns], note: sel.note,
  };
  try{
    const booking = await apiPost('/api/bookings', payload, false);
    confirmedBooking = booking;
    step = 5; render();
  }catch(e){
    if(e.status === 409){
      toast('這個時段剛剛被預約走了，請重新選擇時段');
      sel.time = null; step = 3; render();
    } else {
      toast('送出失敗，請稍後再試');
      if(btn){ btn.disabled=false; btn.textContent='確認送出預約'; }
    }
  }
}

function calviewGridHTML(){
  const y = adminCalMonth.getFullYear(), m = adminCalMonth.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayStr();
  const list = (adminCalMonthData||[]).filter(b=>b.status!=='cancelled');
  const countByDate = {};
  list.forEach(b=>{ countByDate[b.date] = (countByDate[b.date]||0)+1; });
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = fmtDate(new Date(y,m,d));
    const count = countByDate[dateStr] || 0;
    const isToday = dateStr === today;
    const isSel = adminCalSelectedDate === dateStr;
    let level = count===0 ? '' : count<=2 ? 'lv1' : count<=4 ? 'lv2' : 'lv3';
    cells += `<div class="cal-cell"><button class="admin-cal-day ${level} ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectAdminCalDay('${dateStr}')">
      <span class="acd-num">${d}</span>${count>0?`<span class="acd-badge">${count}</span>`:''}
    </button></div>`;
  }
  const dow = ['日','一','二','三','四','五','六'];
  return `
    <div class="cal-head"><button class="cal-nav" onclick="shiftAdminCalMonth(-1)">‹</button><div class="cal-month">${y} 年 ${m+1} 月</div><button class="cal-nav" onclick="shiftAdminCalMonth(1)">›</button></div>
    <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-legend">

function uploadServiceImage(id){

  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ toast('圖片請控制在2MB以內'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result; // data:image/xxx;base64,....
    const base64 = dataUrl.split(',')[1];
    const ext = (file.type.split('/')[1] || 'jpg').replace('jpeg','jpg');
    toast('上傳中...');
    try{
      await apiPost('/api/services-admin', {action:'upload-image', id, imageBase64:base64, imageExt:ext}, true);

      window.__servicesCache = ADMIN_SERVICES_ALL;
      document.getElementById('servicesList').innerHTML = servicesListHTML();
    }catch(e){ toast('上傳失敗'); }
  };
  reader.readAsDataURL(file);
}

async function renderAdminStats(el){
  const today = todayStr();
  const thisMonth = today.slice(0,7);
  const bookings = await loadAllBookings();
  const customers = await loadAllCustomers();
  const confirmed = bookings.filter(b=>b.status!=='cancelled');
  const todayRevenue = confirmed.filter(b=>b.date===today).reduce((s,b)=>s+b.price,0);
  const monthRevenue = confirmed.filter(b=>b.date.slice(0,7)===thisMonth).reduce((s,b)=>s+b.price,0);
  const countByService = {};
  confirmed.forEach(b=>{ countByService[b.serviceId] = (countByService[b.serviceId]||0)+1; });
  let popular = '—';
  const topEntry = Object.entries(countByService).sort((a,b)=>b[1]-a[1])[0];
  if(topEntry) popular = (serviceById(topEntry[0])?serviceById(topEntry[0]).name:topEntry[0]) + '（' + topEntry[1] + ' 次）';

  const monthBookings = confirmed.filter(b=>b.date.slice(0,7)===thisMonth);
  const monthCustomerPhones = [...new Set(monthBookings.map(b=>b.customer.phone))];
  let newCount = 0, returnCount = 0;
  monthCustomerPhones.forEach(phone=>{
    const c = customers.find(x=>x.phone===phone);
    const firstVisitDate = c && c.visits.length ? c.visits.map(v=>v.date).sort()[0] : null;
    if(firstVisitDate && firstVisitDate.slice(0,7)===thisMonth) newCount++; else returnCount++;
  });
  const totalM = newCount+returnCount || 1;
  const newRatio = Math.round(newCount/totalM*100);
  const returnRatio = Math.round(returnCount/totalM*100);

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="label">今日收入</div><div class="value accent-en">${money(todayRevenue)}</div></div>
      <div class="stat"><div class="label">本月收入</div><div class="value accent-en">${money(monthRevenue)}</div></div>
      <div class="stat"><div class="label">熱門課程</div><div class="value" style="font-size:15px;">${popular}</div></div>
      <div class="stat"><div class="label">回流率（本月）</div><div class="value accent-en">${returnRatio}<small>%</small></div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="label">新客比例（本月）</div><div class="value accent-en">${newRatio}<small>% ・ 共 ${totalM} 位客人</small></div></div>
    </div>
    <div style="font-size:11px;color:#6b5a75;line-height:1.8;">統計以「已確認」預約計算，取消的預約不計入。加購金額已併入服務金額計算。</div>`;
}

  const today = todayStr();
  const customers = await loadAllCustomers();
  const candidates = customers.filter(c=>{
    if(!c.visits || !c.visits.length) return false;
    const lastDate = c.visits.map(v=>v.date).sort().slice(-1)[0];
    return daysBetween(lastDate, today) >= 7;
  }).sort((a,b)=>{
    const la = a.visits.map(v=>v.date).sort().slice(-1)[0];
    const lb = b.visits.map(v=>v.date).sort().slice(-1)[0];
    return la.localeCompare(lb);
  });
  window.__custCache = customers;
  el.innerHTML = `
    <div style="font-size:11.5px;color:#6b5a75;margin-bottom:14px;line-height:1.8;">
      以下客人最近一次到店已經 7 天以上、目前沒有新的預約。這裡不會自動發送 LINE，按「複製關心訊息」把文字複製好，貼到 LINE 手動傳送給客人。
    </div>
    ${candidates.length ? candidates.map(c=>{
      const lastDate = c.visits.map(v=>v.date).sort().slice(-1)[0];
      const gap = daysBetween(lastDate, today);
      return `<div class="list-item">
        <div class="li-top"><div class="li-name">${c.name}</div><div style="font-size:11.5px;color:#b3543f;">已 ${gap} 天未回訪</div></div>
        <div class="li-meta">${c.phone}${c.line?'　LINE '+c.line:''}　最近一次 ${lastDate}</div>
        <div class="row-between"><span></span><button class="mini-btn primary" onclick="copyFollowup('${c.phone}')">複製關心訊息</button></div>
      </div>`;
    }).join('') : `<div class="empty-state">目前沒有需要回訪提醒的客人</div>`}`;
}

function renderAdminCalendar(el){
  const url = location.origin + '/api/calendar?key=' + encodeURIComponent(adminToken);
  el.innerHTML = `
    <div style="font-size:12.5px;color:#6b5a75;line-height:1.9;">
      把下面這個網址加到 Google 日曆的「透過網址新增」，就能在手機或電腦上訂閱看到未來三個月的預約。
      Google 那邊是排程更新，不是即時的，通常會間隔幾小時到接近一天才會刷新一次。
    </div>
    <div class="cal-sub">${url}</div>
    <button class="mini-btn" style="margin-top:10px;" onclick="navigator.clipboard.writeText('${url}').then(()=>toast('已複製網址'))">複製網址</button>`;
}

/* boot */
</script>
</body>
</html>
